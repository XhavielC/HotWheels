<meta name="description" content="Dedicatoria interactiva 3D con Galaxia, Corazón neón palpitante, autos Hot Wheels y frases personalizables.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💙</text></svg>">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    margin: 0;
    height: 100%;
    background: #020208;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Indie Flower', cursive, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* Encabezado Principal Neón */
  #main-title {
    position: fixed;
    top: 30px;
    left: 0;
    right: 0;
    width: 100%;
    font-size: clamp(1.6rem, 3.8vw, 2.7rem);
    color: #cdebff;
    text-shadow: 0 0 12px #0099ff, 0 0 24px #00cfff, 0 0 40px #0055ff;
    z-index: 10;
    pointer-events: none;
    text-align: center;
    padding: 0 15px;
    line-height: 1.25;
    letter-spacing: 0.5px;
  }
  #subtitle {
    display: block;
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    color: #8be4ff;
    margin-top: 5px;
    text-shadow: 0 0 10px rgba(0, 207, 255, 0.75);
    letter-spacing: 1px;
  }

  /* Pantalla de Inicio / Click para arrancar */
  #start-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #06152d 0%, #01040a 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #fff;
    z-index: 9999;
    padding: 20px;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #start-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #start-heart {
    font-size: clamp(76px, 22vmin, 136px);
    line-height: 1;
    display: block;
    filter: drop-shadow(0 0 20px rgba(0, 153, 255, 0.9)) drop-shadow(0 0 50px rgba(0, 207, 255, 0.6)) drop-shadow(0 0 80px rgba(30, 144, 255, 0.4));
    animation: heartExplode 1.25s cubic-bezier(0.18, 0.89, 0.32, 1.28) infinite;
    transform-origin: 50% 55%;
  }
  @keyframes heartExplode {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.22); }
    28% { transform: scale(1.04); }
    42% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }
  #start-text {
    font-size: clamp(1.4rem, 4vw, 2.1rem);
    color: #cdebff;
    text-shadow: 0 0 12px #0099ff, 0 0 24px #00cfff;
    text-align: center;
    margin-top: clamp(18px, 4vh, 32px);
    animation: parpadeo 2.2s ease-in-out infinite;
  }
  #start-subtext {
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    color: #7ed8ff;
    margin-top: 8px;
    opacity: 0.85;
  }
  @keyframes parpadeo {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* Botón de Carta / Mensaje Sorpresa */
  #msg-button {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 1800;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #38bdf8, #0284c7 60%, #03487a);
    border: 2px solid #bae6fd;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.8), 0 4px 18px rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: msgBeat 1.8s ease-in-out infinite;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  #msg-button:hover {
    transform: scale(1.12);
    box-shadow: 0 0 35px rgba(56, 189, 248, 1);
  }
  @keyframes msgBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* Modal de la Carta */
  #msg-overlay {
    position: fixed;
    inset: 0;
    z-index: 2500;
    background: radial-gradient(circle at center, rgba(3, 20, 48, 0.72) 0%, rgba(1, 8, 20, 0.88) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    padding: 20px;
    overflow: hidden;
  }
  #msg-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #meteor-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    filter: blur(1.5px);
    opacity: 0.92;
  }
  #msg-card {
    max-width: 600px;
    width: 100%;
    max-height: 84vh;
    overflow-y: auto;
    background: linear-gradient(165deg, rgba(3, 27, 56, 0.95), rgba(1, 13, 28, 0.97));
    border: 1.5px solid rgba(56, 189, 248, 0.5);
    border-radius: 24px;
    padding: 38px 28px;
    box-shadow: 0 0 50px rgba(56, 189, 248, 0.35), inset 0 0 25px rgba(56, 189, 248, 0.15);
    color: #cdebff;
    transform: translateY(22px) scale(0.95);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    z-index: 2;
  }
  #msg-overlay.visible #msg-card {
    transform: translateY(0) scale(1);
  }
  #msg-card h2 {
    text-align: center;
    margin: 0 0 20px;
    font-size: clamp(1.8rem, 3.5vw, 2.3rem);

    text-shadow: 0 0 6px rgba(0, 153, 255, 0.3);

  #msg-close {
    position: absolute;
    top: 14px;
    right: 18px;
    background: none;
    border: none;
    color: #7dd3fc;
    font-size: 1.6rem;
    cursor: pointer;
    line-height: 1;
    padding: 6px;
    transition: color 0.2s, transform 0.2s;
  }
  #msg-close:hover {
    color: #ffffff;
    transform: scale(1.2);
  }

  /* Botón de Sonido Flotante */
  #sound-btn {
    position: fixed;
    left: 22px;
    bottom: 22px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(3, 27, 56, 0.85);
    border: 1.5px solid rgba(56, 189, 248, 0.45);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1800;
    backdrop-filter: blur(6px);
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s, opacity 0.25s;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
  }
  #sound-btn:hover {
    transform: scale(1.12);
    background: rgba(14, 116, 144, 0.95);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
  }
  #sound-btn.playing {
    border-color: #38bdf8;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.75), inset 0 0 10px rgba(56, 189, 248, 0.35);
  }
  #sound-btn svg {
    width: 24px;
    height: 24px;
    fill: #bae6fd;
    transition: fill 0.2s;
  }

  @media (max-width: 600px) {
    #msg-button { width: 52px; height: 52px; bottom: 16px; right: 16px; }
    #sound-btn { width: 44px; height: 44px; bottom: 16px; left: 16px; }
    #msg-card { padding: 28px 18px; border-radius: 18px; }
  }
</style>

// ================= DOM Y CONFIGURACIÓN INICIAL =================

const msgButton = document.getElementById('msg-button');

// ================= LLUVIA DE METEORITOS Y COMETAS (SOLO AL ABRIR LA CARTA) =================
const meteorCanvas = document.getElementById('meteor-canvas');
const mCtx = meteorCanvas ? meteorCanvas.getContext('2d') : null;
let meteorAnimationId = null;
let meteors = [];
let meteorSparks = [];

function resizeMeteorCanvas() {
  if (!meteorCanvas || !mCtx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  meteorCanvas.width = window.innerWidth * dpr;
  meteorCanvas.height = window.innerHeight * dpr;
  mCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

class LetterMeteor {
  constructor(w, h, isInitial = false) {
    this.reset(w, h, isInitial);
  }

  reset(w, h, isInitial = false) {
    // Escala de profundidad (0 = cometa tenue y lejano, 1 = cometa estelar visible)
    this.depth = Math.random();
    this.speed = 8.5 + this.depth * 9.5;
    // Ángulo de caída coordinado en diagonal (~128°)
    this.angle = Math.PI * (0.71 + (Math.random() - 0.5) * 0.06);
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;

    this.length = 85 + this.depth * 135;
    this.lineWidth = 1.2 + this.depth * 1.8;

    const colorType = Math.random();
    if (colorType < 0.45) {
      this.headColor = '#ffffff';
      this.glowColor = '#38bdf8';
      this.tailRgb = '56, 189, 248';
    } else if (colorType < 0.8) {
      this.headColor = '#e0f2fe';
      this.glowColor = '#00e5ff';
      this.tailRgb = '0, 229, 255';
    } else {
      this.headColor = '#ffffff';
      this.glowColor = '#93c5fd';
      this.tailRgb = '147, 197, 253';
    }

    this.maxOpacity = 0.42 + this.depth * 0.46;
    this.opacity = isInitial ? (Math.random() * this.maxOpacity) : 0;
    this.fadingIn = true;

    if (isInitial) {
      this.x = Math.random() * (w + 350) - 150;
      this.y = Math.random() * (h + 150) - 100;
      this.active = true;
      this.delay = 0;
    } else {
      if (Math.random() < 0.6) {
        this.x = Math.random() * (w + 250);
        this.y = -60 - Math.random() * 120;
      } else {
        this.x = w + 40 + Math.random() * 140;
        this.y = Math.random() * (h * 0.65);
      }
      this.active = false;
      this.delay = Math.floor(Math.random() * 75);
    }
  }

  update(w, h) {
    if (!this.active) {
      if (this.delay > 0) {
        this.delay--;
        return;
      }
      this.active = true;
    }

    this.x += this.vx;
    this.y += this.vy;

    if (this.fadingIn) {
      this.opacity += 0.05;
      if (this.opacity >= this.maxOpacity) {
        this.opacity = this.maxOpacity;
        this.fadingIn = false;
      }
    }

    // Pequeñas chispas estelares para los cometas más notables
    if (this.depth > 0.55 && Math.random() < 0.35) {
      meteorSparks.push({
        x: this.x + (Math.random() - 0.5) * 4,
        y: this.y + (Math.random() - 0.5) * 4,
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6,
        alpha: this.opacity * 0.75,
        size: 0.8 + Math.random() * 1.2
      });
    }

    if (this.x < -this.length - 80 || this.y > h + this.length + 80) {
      this.reset(w, h, false);
    }
  }

  draw(ctx) {
    if (!this.active || this.opacity <= 0.01) return;

    const tailX = this.x - Math.cos(this.angle) * this.length;
    const tailY = this.y - Math.sin(this.angle) * this.length;

    const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
    grad.addColorStop(0, this.headColor);
    grad.addColorStop(0.2, `rgba(${this.tailRgb}, ${this.opacity * 0.85})`);
    grad.addColorStop(0.65, `rgba(${this.tailRgb}, ${this.opacity * 0.28})`);
    grad.addColorStop(1, `rgba(${this.tailRgb}, 0)`);

    ctx.save();
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.lineWidth;
    ctx.lineCap = 'round';
    ctx.shadowColor = this.glowColor;
    ctx.shadowBlur = 6 + this.depth * 6;

    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();

    ctx.fillStyle = this.headColor;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.lineWidth * 0.95, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

function startMeteorShower() {
  if (!meteorCanvas || !mCtx) return;
  stopMeteorShower();
  resizeMeteorCanvas();

  const w = window.innerWidth;
  const h = window.innerHeight;
  const count = 16;
  meteors = [];
  meteorSparks = [];

  for (let i = 0; i < count; i++) {
    meteors.push(new LetterMeteor(w, h, true));
  }

  function loop() {
    mCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    const curW = window.innerWidth;
    const curH = window.innerHeight;

    for (let i = 0; i < meteors.length; i++) {
      meteors[i].update(curW, curH);
      meteors[i].draw(mCtx);
    }

    for (let i = meteorSparks.length - 1; i >= 0; i--) {
      const s = meteorSparks[i];
      s.x += s.vx;
      s.y += s.vy;
      s.alpha -= 0.035;
      if (s.alpha <= 0) {
        meteorSparks.splice(i, 1);
      } else {
        mCtx.fillStyle = `rgba(186, 230, 253, ${s.alpha})`;
        mCtx.beginPath();
        mCtx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        mCtx.fill();
      }
    }

    meteorAnimationId = requestAnimationFrame(loop);
  }

  meteorAnimationId = requestAnimationFrame(loop);
}

function stopMeteorShower() {
  if (meteorAnimationId) {
    cancelAnimationFrame(meteorAnimationId);
    meteorAnimationId = null;
  }
  if (meteorCanvas && mCtx) {
    mCtx.clearRect(0, 0, meteorCanvas.width, meteorCanvas.height);
  }
  meteors = [];
  meteorSparks = [];
}

window.addEventListener('resize', () => {
  if (msgOverlay.classList.contains('visible')) {
    resizeMeteorCanvas();
  }
});

// ================= CONTROL DE AUDIO Y COMPÁS MUSICAL =================
const audio = document.getElementById('audio');
const soundBtn = document.getElementById('sound-btn');
let isAudioPlaying = false;

// Garantizar volumen al máximo
audio.volume = 1.0;

// Cargar la pista de música
audio.src = CONFIG.musica;
audio.load();

// Respaldo automático si el archivo local tuviera algún problema de ruta
audio.addEventListener('error', function() {
  if (CONFIG.musicaFallback && audio.src !== CONFIG.musicaFallback) {
    console.log("Cargando pista de música de respaldo...");
    audio.src = CONFIG.musicaFallback;
    audio.load();
    if (isAudioPlaying) audio.play().catch(() => {});
  }
});

function updateSoundButtonUI(playing) {
  if (playing) {
    soundBtn.classList.add('playing');
    soundBtn.style.opacity = '1';
    soundBtn.setAttribute('title', 'Pausar música');
  } else {
    soundBtn.classList.remove('playing');
    soundBtn.style.opacity = '0.55';
    soundBtn.setAttribute('title', 'Reproducir música');
  }
}

function toggleAudio() {
  if (audio.paused) {
    audio.play().then(() => {
      isAudioPlaying = true;
      updateSoundButtonUI(true);
    }).catch((err) => {
      console.log("Error al reproducir audio:", err);
    });
  } else {
    audio.pause();
    isAudioPlaying = false;
    updateSoundButtonUI(false);
  }
}
soundBtn.addEventListener('click', toggleAudio);

audio.addEventListener('play', () => {
  isAudioPlaying = true;
  updateSoundButtonUI(true);
});
audio.addEventListener('pause', () => {
  isAudioPlaying = false;
  updateSoundButtonUI(false);
});

// ================= ESCENA THREE.JS =================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
// Sin niebla (fog) para que el cosmos sea infinito, cristalino y profundo

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 12000);
let targetDist = 310, currentDist = 310;

function createMiniGalaxyTexture(type = 0) {
  const size = 256;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const cx = size / 2, cy = size / 2;

  // Núcleo galáctico brillante
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 26);
  coreGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
  coreGrad.addColorStop(0.3, type === 0 ? 'rgba(180, 240, 255, 0.95)' : (type === 1 ? 'rgba(235, 195, 255, 0.95)' : 'rgba(255, 230, 175, 0.95)'));
  coreGrad.addColorStop(0.7, type === 0 ? 'rgba(0, 160, 255, 0.45)' : (type === 1 ? 'rgba(168, 85, 247, 0.45)' : 'rgba(245, 158, 11, 0.45)'));
  coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, 26, 0, Math.PI * 2);
  ctx.fill();

  // Brazos espirales con polvo estelar
  const arms = 2;
  const count = 1100;
  for (let i = 0; i < count; i++) {
    const arm = i % arms;
    const dist = 8 + Math.pow(Math.random(), 1.1) * (size * 0.42);
    const baseAngle = arm * Math.PI + dist * 0.055;
    const spread = (Math.random() - 0.5) * (dist * 0.32);
    const angle = baseAngle + spread / dist;
    const px = cx + Math.cos(angle) * dist;
    const py = cy + Math.sin(angle) * dist * 0.65; // Inclinación elíptica

    const pRadius = 0.6 + Math.random() * 1.4;
    const alpha = Math.max(0.12, 1.0 - (dist / (size * 0.44)));

    ctx.fillStyle = (Math.random() > 0.45)
      ? `rgba(255, 255, 255, ${alpha * 0.85})`
      : (type === 0 ? `rgba(56, 189, 248, ${alpha * 0.9})` : (type === 1 ? `rgba(192, 132, 252, ${alpha * 0.9})` : `rgba(251, 191, 36, ${alpha * 0.9})`));
    ctx.beginPath();
    ctx.arc(px, py, pRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  // Resplandor difuso exterior
  const halo = ctx.createRadialGradient(cx, cy, 20, cx, cy, size * 0.48);
  halo.addColorStop(0, type === 0 ? 'rgba(0, 160, 255, 0.18)' : 'rgba(168, 85, 247, 0.18)');
  halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, size, size);

  return new THREE.CanvasTexture(c);
}

const cometState = {
  active: false,
  timer: 5.0, // El primer cometa cruza a los 5 segundos para apreciarlo de inmediato
  progress: 0,
  duration: 2.2,
  startPos: new THREE.Vector3(),
  endPos: new THREE.Vector3(),
  currentPos: new THREE.Vector3(),
  history: []
};

function launchComet() {
  cometState.active = true;
  cometState.progress = 0;
  cometState.duration = 1.9 + Math.random() * 0.7; // 1.9s a 2.6s
  cometState.history = [];

  // Posición inicial en el espacio cósmico
  const th = Math.random() * Math.PI * 2;
  const ph = 0.35 + Math.random() * 0.8;
  const r = 850 + Math.random() * 200;

  cometState.startPos.set(
    r * Math.sin(ph) * Math.cos(th),
    r * Math.cos(ph),
    r * Math.sin(ph) * Math.sin(th)
  );

  // Trayectoria elegante cruzando el cielo
  const dir = new THREE.Vector3(
    (Math.random() - 0.5) * 1.5,
    -0.4 - Math.random() * 0.6,
    (Math.random() - 0.5) * 1.5
  ).normalize();

  const distance = 800 + Math.random() * 400;
  cometState.endPos.copy(cometState.startPos).addScaledVector(dir, distance);
  cometHead.visible = true;
}

function updateComet(dt) {
  if (!cometState.active) {
    cometState.timer -= dt;
    if (cometState.timer <= 0) {
      launchComet();
    }
    return;
  }

  cometState.progress += dt / cometState.duration;
  const p = cometState.progress;

  if (p >= 1.0) {
    cometState.active = false;
    cometHead.visible = false;
    trailMat.opacity = 0;
    // Siguiente cometa aleatorio cada 20 a 30 segundos
    cometState.timer = 20.0 + Math.random() * 12.0;
    return;
  }

  // Curva de visibilidad (aparece, brilla y se desvanece suavemente)
  let opacity = 1.0;
  if (p < 0.18) {
    opacity = p / 0.18;
  } else if (p > 0.65) {
    opacity = 1.0 - (p - 0.65) / 0.35;
  }
  cometHead.material.opacity = opacity;
  trailMat.opacity = opacity * 0.88;

  // Desplazamiento del cometa
  cometState.currentPos.lerpVectors(cometState.startPos, cometState.endPos, p);
  cometHead.position.copy(cometState.currentPos);

  // Registro de la cola luminosa
  cometState.history.unshift(cometState.currentPos.clone());
  if (cometState.history.length > TRAIL_LENGTH) {
    cometState.history.pop();
  }

  const posArr = trailGeo.attributes.position.array;
  for (let i = 0; i < TRAIL_LENGTH; i++) {
    const pt = cometState.history[i] || cometState.currentPos;
    posArr[i * 3 + 0] = pt.x;
    posArr[i * 3 + 1] = pt.y;
    posArr[i * 3 + 2] = pt.z;
  }
  trailGeo.attributes.position.needsUpdate = true;
}

const heartGroup = new THREE.Group();

// Estructura volumétrica y de contorno brillante
const TOTAL_HEART_POINTS = 7200;
const heartGeo = new THREE.BufferGeometry();
const heartPositions = new Float32Array(TOTAL_HEART_POINTS * 3);
const heartBasePos = new Float32Array(TOTAL_HEART_POINTS * 3);
const heartNormals = new Float32Array(TOTAL_HEART_POINTS * 3);
const heartColors = new Float32Array(TOTAL_HEART_POINTS * 3);
const heartBaseColors = new Float32Array(TOTAL_HEART_POINTS * 3);
const heartParticlePhase = new Float32Array(TOTAL_HEART_POINTS);

for (let i = 0; i < TOTAL_HEART_POINTS; i++) {
  const t = Math.random() * Math.PI * 2;
  const phi = (Math.random() - 0.5) * Math.PI;

  // Ecuación paramétrica de corazón 3D
  let x = 16 * Math.pow(Math.sin(t), 3);
  let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t) + 2.2;
  let z = 8.5 * Math.sin(phi) * (0.35 + 0.65 * Math.abs(Math.sin(t)));

  // Diferenciación: Contorno denso cristalino vs. Relleno volumétrico interno
  const isShell = Math.random() > 0.35;
  const vol = isShell ? (0.94 + Math.random() * 0.1) : Math.pow(Math.random(), 0.55);
  
  const scale = 2.85;
  x *= vol * scale;
  y *= vol * scale;
  z *= vol * scale;

  // Normal aproximada hacia afuera para la explosión rítmica
  const len = Math.hypot(x, y, z) || 1;
  const nx = x / len;
  const ny = y / len;
  const nz = z / len;

  heartPositions[i * 3 + 0] = x;
  heartPositions[i * 3 + 1] = y;
  heartPositions[i * 3 + 2] = z;

  heartBasePos[i * 3 + 0] = x;
  heartBasePos[i * 3 + 1] = y;
  heartBasePos[i * 3 + 2] = z;

  heartNormals[i * 3 + 0] = nx;
  heartNormals[i * 3 + 1] = ny;
  heartNormals[i * 3 + 2] = nz;

  heartParticlePhase[i] = Math.random() * Math.PI * 2;

  // Colores: Blanco diamante brillante en el contorno, Azul Eléctrico y Cian en el centro
  const col = new THREE.Color();
  if (isShell && Math.random() > 0.4) {
    col.setHex(0xffffff); // Destello diamante
  } else if (Math.random() > 0.35) {
    col.setHex(0x00e5ff); // Cian neón radiante
  } else {
    col.setHex(0x1e90ff); // Azul Hot Wheels eléctrico
  }

  heartColors[i * 3 + 0] = col.r;
  heartColors[i * 3 + 1] = col.g;
  heartColors[i * 3 + 2] = col.b;

  heartBaseColors[i * 3 + 0] = col.r;
  heartBaseColors[i * 3 + 1] = col.g;
  heartBaseColors[i * 3 + 2] = col.b;
}

  ctx.fillStyle = g;

  ctx.moveTo(cx, cy - 26); ctx.lineTo(cx, cy + 26);
  ctx.moveTo(cx - 26, cy); ctx.lineTo(cx + 26, cy);
  ctx.stroke();

  return new THREE.CanvasTexture(c);
}

  emberColors[i * 3 + 2] = c.b;

  emberData.push({
    x: hx,
    y: hy,
    z: hz,
    vy: 0.28 + Math.random() * 0.42,
    driftSpeed: 1.2 + Math.random() * 1.5,
    driftPhase: Math.random() * Math.PI * 2,
    maxHeight: hy + 38 + Math.random() * 35
  });
}

emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
emberGeo.setAttribute('color', new THREE.BufferAttribute(emberColors, 3));

const emberMat = new THREE.PointsMaterial({

// ================= ANILLOS CÓSMICOS DE VELOCIDAD (DUAL SPEEDWAY) =================
function createSpeedwayRing() {
  const count = 1600;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const r = 85 + (Math.random() - 0.5) * 12;
    pos[i * 3 + 0] = Math.cos(angle) * r;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 3;
    pos[i * 3 + 2] = Math.sin(angle) * r;

    const c = new THREE.Color();
    c.setHSL(0.55 + Math.random() * 0.06, 0.9, 0.65 + Math.random() * 0.25);
    col[i * 3 + 0] = c.r;
    col[i * 3 + 1] = c.g;
    col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 2.2,
    map: pTexture,
    vertexColors: true,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const ring = new THREE.Points(geo, mat);
  ring.rotation.x = Math.PI * 0.32;
  ring.rotation.z = Math.PI * 0.15;
  return ring;
}
const speedwayRing = createSpeedwayRing();
scene.add(speedwayRing);

// ================= FLOTA DE AUTOS HOT WHEELS (MODELOS REALES) =================
const hotWheelsCarSources = (window.HOTWHEELS_CARS && window.HOTWHEELS_CARS.length > 0)
  ? window.HOTWHEELS_CARS
  : CONFIG.fotos;

// Pre-cargar imágenes para dibujarlas en el canvas de cada frase y en los sprites 3D
const loadedCarImages = hotWheelsCarSources.map(src => {
  const im = new Image();
  im.src = src;
  return im;
});

// ================= FRASES FLOTANTES CON CARRO HOT WHEELS A LA IZQUIERDA =================
const frasesBase = CONFIG.frases;
const WORD_SLOTS = 140;
const WORDS = Array.from({ length: WORD_SLOTS }, (_, i) => frasesBase[i % frasesBase.length]);

function makeTextTexture(text, glowColor, carImg) {
  const c = document.createElement('canvas');
  c.width = 720;
  c.height = 128;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);

  let textStartX = 24;

  // Dibujar el auto Hot Wheels real a la izquierda de las letras
  if (carImg && (carImg.naturalWidth || carImg.width)) {
    const aspect = (carImg.naturalWidth / carImg.naturalHeight) || 3.4;
    const carH = 46;
    const carW = carH * aspect;
    const carY = (c.height - carH) / 2;

    ctx.save();
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 18;
    ctx.drawImage(carImg, 20, carY, carW, carH);
    ctx.restore();

    textStartX = 20 + carW + 18;
  }

  // Dibujar el texto a la derecha del auto con brillo neón
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 24;

  const maxTextWidth = c.width - textStartX - 24;
  let fontSize = 46;
  ctx.font = fontSize + "px 'Indie Flower', cursive";
  while (ctx.measureText(text).width > maxTextWidth && fontSize > 20) {
    fontSize -= 2;
    ctx.font = fontSize + "px 'Indie Flower', cursive";
  }
  ctx.fillText(text, textStartX, c.height / 2);

  return new THREE.CanvasTexture(c);
}

const TEXT_COLORS = ['#00e5ff', '#1e90ff', '#38bdf8', '#7dd3fc', '#00cfff', '#60a5fa'];
const textGroup = new THREE.Group();
scene.add(textGroup);

// Esperar a que la fuente y las imágenes estén listas antes de estampar
Promise.all([
  document.fonts.load("40px 'Indie Flower'"),
  ...loadedCarImages.map(im => new Promise(res => {
    if (im.complete && im.naturalWidth > 0) res();
    else {
      im.onload = res;
      im.onerror = res;
    }
  }))
]).then(() => {
  for (let i = 0; i < WORDS.length; i++) {
    const carImg = loadedCarImages[i % loadedCarImages.length];
    const tex = makeTextTexture(WORDS[i], TEXT_COLORS[i % TEXT_COLORS.length], carImg);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(78, 13.8, 1);
    
    // Frases en la misma esfera orbital que los autos (R = 150 a 275)
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    const r = 150 + Math.random() * 125;
    sp.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
    sp.userData = { phi, theta, radius: r, speed: 0.0007 + Math.random() * 0.0009 };
    textGroup.add(sp);
  }
});

// ================= FLOTA DE AUTOS HOT WHEELS 3D ORBITALES =================
const carGroup = new THREE.Group();
scene.add(carGroup);

const CAR_COUNT = 34;
const carSprites = [];
const FOTO_ESCALA = (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768) ? 1.35 : 1;

for (let i = 0; i < CAR_COUNT; i++) {
  const carIndex = i % hotWheelsCarSources.length;
  const src = hotWheelsCarSources[carIndex];

  // BaseWidth generosa para que los autos se vean espectaculares y claros
  const baseWidth = (54 + (i % 6) * 5) * FOTO_ESCALA;

  const img = new Image();
  const tex = new THREE.Texture(img);
  const mat = new THREE.SpriteMaterial({
    map: tex,
    transparent: true,
    depthWrite: false
  });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(baseWidth, baseWidth * 0.32, 1);

  img.onload = function() {
    tex.needsUpdate = true;
    const aspect = img.naturalWidth / img.naturalHeight || 3.4;
    sp.scale.set(baseWidth, baseWidth / aspect, 1);
  };
  img.src = src;

  // Órbita de los carritos: Junto a las frases (R = 145 a 275)
  // Al igual que en la plantilla original, los autos flotan directamente al lado de las letras
  const phi = Math.acos(2 * Math.random() - 1);
  const theta = Math.random() * Math.PI * 2;
  const radius = 145 + Math.random() * 130;

  sp.position.set(
    radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );

  // Los autos rotan en concordancia a su dirección
  const isClockwise = (i % 2 === 0);
  sp.userData = {
    phi: phi,
    theta: theta,
    radius: radius,
    speed: (0.0007 + Math.random() * 0.001) * (isClockwise ? 1 : -1),
    yFloatOffset: Math.random() * Math.PI * 2,
    baseWidth: baseWidth
  };

  carGroup.add(sp);
  carSprites.push(sp);
}

// ================= CONTROLES DE CÁMARA E INTERACCIÓN =================
function onPointerDown(e) {
  isPointerDown = true;
  velX = 0; velY = 0;
  const t = e.touches ? e.touches[0] : e;
  startX = t.clientX;
  startY = t.clientY;
}

function onPointerMove(e) {
  if (!isPointerDown) return;
  if (e.touches && e.touches.length > 1) return;
  const t = e.touches ? e.touches[0] : e;
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;
  const sensX = (Math.PI * 1.6) / window.innerWidth;
  const sensY = (Math.PI * 0.9) / window.innerHeight;
  velY = -dx * sensX;
  velX = dy * sensY;
  targetRotY += velY;
  targetRotX = Math.max(-1.3, Math.min(1.3, targetRotX + velX));
  startX = t.clientX;
  startY = t.clientY;
}

function onPointerUp() {
  isPointerDown = false;
}

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('touchstart', onPointerDown, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });
window.addEventListener('touchend', onPointerUp, { passive: true });

// Zoom suave
window.addEventListener('wheel', (e) => {
  targetDist += e.deltaY * 0.28;
  targetDist = Math.max(120, Math.min(850, targetDist));
}, { passive: true });

// Pellizco en móviles
let pinchDist = 0;
window.addEventListener('touchmove', (e) => {
  if (e.touches && e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx, dy);
    if (pinchDist) {
      targetDist += (pinchDist - d) * 0.6;
      targetDist = Math.max(120, Math.min(850, targetDist));
    }
    pinchDist = d;
  }
}, { passive: false });
window.addEventListener('touchend', () => { pinchDist = 0; }, { passive: true });

// ================= BUCLE PRINCIPAL DE ANIMACIÓN =================
const clock = new THREE.Clock();
const INERTIA_DECAY = 0.90;

let lastFrameTime = 0;
let smoothBeat = 0;

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();
  const dt = Math.min(0.05, Math.max(0.001, elapsedTime - lastFrameTime));
  lastFrameTime = elapsedTime;

  // Inercia de rotación al soltar
  if (!isPointerDown) {
    velX *= INERTIA_DECAY;
    velY *= INERTIA_DECAY;
    targetRotX = Math.max(-1.3, Math.min(1.3, targetRotX + velX));
    targetRotY += velY;
  }
  rotX += (targetRotX - rotX) * 0.12;
  rotY += (targetRotY - rotY) * 0.12;

  // Sincronización rítmica musical de precisión con la canción
  let targetBeat = 0;

  if (isAudioPlaying && !audio.paused && (audio.currentTime > 0 || audio.duration > 0)) {
    const bpm = CONFIG.bpm || 76;
    const secondsPerBeat = 60.0 / bpm;
    const beatPhase = (audio.currentTime / secondsPerBeat) % 1.0;

    // Curva cardíaca anatómica y musical: Lub-Dub (Sístole + Diástole + Reposo)
    if (beatPhase < 0.18) {
      // 1. Sístole ventricular (Golpe principal rítmico, rápido y enérgico)
      targetBeat = Math.sin((beatPhase / 0.18) * Math.PI);
    } else if (beatPhase >= 0.22 && beatPhase < 0.38) {
      // 2. Diástole (Segundo latido o eco armónico de menor intensidad)
      targetBeat = Math.sin(((beatPhase - 0.22) / 0.16) * Math.PI) * 0.52;
    } else {
      // 3. Pausa de reposo (permite contemplar las estrellas y frases en calma)
      targetBeat = 0;
    }
  } else {
    // Si la música está en pausa, mantener un latido sutil de reposo
    const restCycle = (elapsedTime * 1.1) % 1.0;
    if (restCycle < 0.18) {
      targetBeat = Math.sin((restCycle / 0.18) * Math.PI) * 0.65;
    } else if (restCycle >= 0.22 && restCycle < 0.38) {
      targetBeat = Math.sin(((restCycle - 0.22) / 0.16) * Math.PI) * 0.35;
    } else {
      targetBeat = 0;
    }
  }

  // Interpolación lerp suave para un latido elástico, orgánico y continuo
  smoothBeat += (targetBeat - smoothBeat) * 0.26;

  // Factor de escala del corazón: latido elegante (crece hasta +11% en el pico de sístole)
  const heartScale = 1.0 + smoothBeat * 0.11;
  heartGroup.scale.set(heartScale, heartScale, heartScale);

  // Balanceo orgánico sutil en el espacio (efecto ingravidez cósmica)
  heartGroup.rotation.y = elapsedTime * 0.055;
  heartGroup.rotation.x = Math.sin(elapsedTime * 0.7) * 0.055;
  heartGroup.rotation.z = Math.cos(elapsedTime * 0.6) * 0.035;

  // Respiración suave y onda de luz ascendente en cada latido
  const positions = heartGeo.attributes.position.array;
  const colors = heartGeo.attributes.color.array;
  const particleExpansion = smoothBeat * 0.45;

  // Altura de la onda lumínica que viaja por el corazón en cada latido (desde el ápice a los lóbulos)
  const waveY = -42 + smoothBeat * 88;
  const waveWidth = 24.0;

  for (let i = 0; i < TOTAL_HEART_POINTS; i++) {
    const idx = i * 3;
    const bx = heartBasePos[idx + 0];
    const by = heartBasePos[idx + 1];
    const bz = heartBasePos[idx + 2];
    const nx = heartNormals[idx + 0];
    const ny = heartNormals[idx + 1];
    const nz = heartNormals[idx + 2];

    const shimmer = Math.sin(elapsedTime * 3.5 + heartParticlePhase[i]) * 0.25;
    positions[idx + 0] = bx + nx * (particleExpansion + shimmer);
    positions[idx + 1] = by + ny * (particleExpansion + shimmer);
    positions[idx + 2] = bz + nz * (particleExpansion + shimmer);

    // Destello de onda de luz musical ascendente
    const distToWave = Math.abs(by - waveY);
    let waveBoost = 0;
    if (distToWave < waveWidth && smoothBeat > 0.02) {
      waveBoost = (1 - distToWave / waveWidth) * smoothBeat * 0.42;
    }

    const br = heartBaseColors[idx + 0];
    const bg = heartBaseColors[idx + 1];
    const bb = heartBaseColors[idx + 2];
    colors[idx + 0] = Math.min(1.0, br + waveBoost * 0.95);
    colors[idx + 1] = Math.min(1.0, bg + waveBoost * 0.85);
    colors[idx + 2] = Math.min(1.0, bb + waveBoost * 0.50);
  }
  heartGeo.attributes.position.needsUpdate = true;
  heartGeo.attributes.color.needsUpdate = true;

  // Actualizar chispas / brasas celestiales flotantes que emanan del corazón
  const ePos = emberGeo.attributes.position.array;
  for (let i = 0; i < EMBER_COUNT; i++) {
    const d = emberData[i];
    d.y += d.vy * (1 + smoothBeat * 1.4);
    d.x += Math.sin(elapsedTime * d.driftSpeed + d.driftPhase) * 0.16;
    d.z += Math.cos(elapsedTime * d.driftSpeed + d.driftPhase) * 0.16;

    if (d.y > d.maxHeight) {
      const t = Math.random() * Math.PI * 2;
      d.x = 16 * Math.pow(Math.sin(t), 3) * 2.2 * Math.random();
      d.y = ((13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t) + 2.2) * 2.2 * Math.random()) - 15;
      d.z = (Math.random() - 0.5) * 20;
      d.maxHeight = d.y + 38 + Math.random() * 38;
    }

    ePos[i * 3 + 0] = d.x;
    ePos[i * 3 + 1] = d.y;
    ePos[i * 3 + 2] = d.z;
  }
  emberGeo.attributes.position.needsUpdate = true;

  // Destellos diamante en el contorno del corazón (titileo sutil de gemas)
  for (let i = 0; i < diamondFlares.length; i++) {
    const df = diamondFlares[i];
    const tw = Math.sin(elapsedTime * 2.6 + df.userData.phase);
    const sz = df.userData.baseSize * (0.8 + tw * 0.32 + smoothBeat * 0.35);
    df.scale.set(sz, sz, 1);
    df.material.opacity = 0.35 + 0.35 * tw + smoothBeat * 0.28;
  }

  // Resplandor celestial suave detrás del corazón (atenuado y elegante, sin deslumbrar la vista)
  const glowFlash = 95 * (1 + smoothBeat * 0.16);
  heartGlowSprite.scale.set(glowFlash, glowFlash, 1);
  heartGlowSprite.material.opacity = 0.28 + smoothBeat * 0.14;

  // Giro de los elementos cósmicos
  speedwayRing.rotation.z += 0.003;
  speedwayInnerRing.rotation.z -= 0.004;
  deepUniverseGroup.rotation.y = elapsedTime * 0.005;

  // Giro elegante de las micro-galaxias lejanas en su propio eje
  miniGalaxies.forEach(mg => {
    mg.material.rotation += mg.userData.rotSpeed;
  });

  // Animación del cometa / estrella fugaz periódica
  updateComet(dt);

  // Animación orbital de frases con oscilación suave
  textGroup.children.forEach(sp => {
    sp.userData.theta += sp.userData.speed;
    sp.material.opacity = 0.84 + 0.16 * Math.sin(elapsedTime * 2.0 + sp.userData.radius);
    sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
    sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
  });

  // Animación orbital y navegación de los autos Hot Wheels
  carSprites.forEach(sp => {
    sp.userData.theta += sp.userData.speed;
    const floatY = Math.sin(elapsedTime * 1.6 + sp.userData.yFloatOffset) * 4.5;
    sp.position.x = sp.userData.radius * Math.sin(sp.userData.phi) * Math.cos(sp.userData.theta);
    sp.position.y = sp.userData.radius * Math.cos(sp.userData.phi) + floatY;
    sp.position.z = sp.userData.radius * Math.sin(sp.userData.phi) * Math.sin(sp.userData.theta);
  });

  // Interpolación de la cámara (Zoom + Rotación esférica)
  currentDist += (targetDist - currentDist) * 0.07;
  const cx = Math.cos(rotX), sx = Math.sin(rotX);
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  camera.position.set(currentDist * sy * cx, currentDist * sx, currentDist * cy * cx);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

// ================= REDIMENSIONAMIENTO RESPONSIVE =================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const startScreen = document.getElementById('start-screen');
function startExperience() {
  startScreen.classList.add('hidden');
  setTimeout(() => startScreen.style.display = 'none', 850);

  // Iniciar audio con soporte nativo
  audio.play().then(() => {
    isAudioPlaying = true;
    updateSoundButtonUI(true);
  }).catch((err) => {
    console.log("Audio play info:", err);
    updateSoundButtonUI(false);
  });
}
startScreen.addEventListener('click', startExperience);
startScreen.addEventListener('touchend', startExperience);
